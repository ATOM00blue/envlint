[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envlint"
version = "0.1.0"
description = "Lint, validate, and document your .env files: catch missing vars, leaked secrets, and typos before they bite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ATOM00blue" }]
keywords = ["dotenv", "env", "cli", "security", "linter", "secrets", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ATOM00blue/envlint"
Repository = "https://github.com/ATOM00blue/envlint"
Issues = "https://github.com/ATOM00blue/envlint/issues"
Changelog = "https://github.com/ATOM00blue/envlint/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
envlint = "envlint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/envlint"]

[tool.hatch.build.targets.sdist]
include = ["src/envlint", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by formatter, not enforced
    "UP007",  # keep Optional/Union for clean 3.9 compatibility
    "UP045",  # keep Optional[X] (Typer reads these annotations at runtime)
    "B008",   # typer.Option()/Argument() in defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["envlint"]
branch = true
